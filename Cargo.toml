[package]
name = "rymplayer"
version = "0.7.0"
edition = "2024"
autobins = false
build = "build.rs"

[dependencies]
# Software rendering only (tiny-skia): no GPU driver memory, keeps the window app light.
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "image", "svg", "tokio", "advanced", "advanced-shaping", "crisp", "x11", "wayland"] }
anyhow = "1.0.104"
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["mkv", "ogg", "isomp4", "aac", "opt-simd"] }
symphonia-adapter-libopus = "0.3"
# The Google sign-in window (feature "webview", on by default).
tao = { version = "0.37.2", optional = true }
tokio = { version = "1.54.1", features = ["full"] }
wry = { version = "0.57.1", optional = true }
# The YouTube Music API library (its crates.io name is ytmapi-rs).
music_api = { package = "ytmapi-rs", version = "0.3.3" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# The GTK 4 window app (needs GTK 4 to build): `cargo build --release --features gtk-ui --bin RymPlayer-GTK`.
gtk = { package = "gtk4", version = "0.11.5", optional = true, features = ["v4_12"] }

[features]
default = ["webview"]
webview = ["dep:wry", "dep:tao"]
gtk-ui = ["dep:gtk"]

[profile.release]
# Smallest files: optimize for size, whole-program LTO, no unwinding tables, no symbols.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lib]
name = "rymplayer"
path = "src/lib.rs"

[[bin]]
name = "RyM"
path = "src/main.rs"

[[bin]]
name = "RymPlayer-GUI"
path = "src/bin/gui/main.rs"

[[bin]]
name = "RymPlayer-GTK"
path = "src/bin/gtk/main.rs"
required-features = ["gtk-ui"]

[build-dependencies]
# Puts each program's icon inside its .exe (Windows).
embed-resource = "3"

[dev-dependencies]
iced_test = "0.14.0"
