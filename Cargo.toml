[package]
name = "rymplayer"
version = "7.4.2"
edition = "2024"
license = "MIT"
autobins = false
build = "build.rs"

[dependencies]
# Software rendering only (tiny-skia): no GPU driver memory, keeps the window app light.
anyhow = "1.0.104"
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["mkv", "ogg", "isomp4", "aac", "opt-simd", "mp3", "flac", "wav", "pcm", "vorbis", "alac", "id3v2"] }
symphonia-adapter-libopus = "0.3"
# The Google sign-in window (feature "webview", on by default).
tao = { version = "0.37.2", optional = true }
tokio = { version = "1.54.1", features = ["full"] }
flate2 = "1"
sha2 = "0.10"
sha1 = "0.11"
url = "2"
wry = { version = "0.57.1", optional = true }
# The YouTube Music API library (its crates.io name is ytmapi-rs).
music_api = { package = "ytmapi-rs", version = "0.3.3", features = ["reqwest"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# The GTK 4 window app (needs GTK 4 to build): `cargo build --release --features gtk-ui --bin RymPlayer-GTK`.
gtk = { package = "gtk4", version = "0.11.5", optional = true, features = ["v4_12"] }
# Media keys and the system's media controls (Windows: the volume flyout; Linux: MPRIS).
souvlaki = { version = "0.9", optional = true, default-features = false, features = ["use_zbus"] }
lofty = "0.25.5"
ar-reshaper = "1.5.0"
unicode-bidi = "0.3.18"
arboard = { version = "3", default-features = false, features = ["image-data"] }
# The system's folder window (RyM Slint's "Add a folder").
rfd = { version = "0.18", optional = true }
discord-rich-presence = "1.1"
md5 = "0.7"
tray-icon = { version = "0.26", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
slint = { version = "1.18.1", optional = true, features = ["renderer-skia", "renderer-software", "software-renderer-systemfonts", "unstable-winit-030"] }

[features]
default = ["webview"]
webview = ["dep:wry", "dep:tao"]
gtk-ui = ["dep:gtk", "dep:souvlaki"]
slint-ui = ["dep:slint", "dep:slint-build", "dep:souvlaki", "dep:tray-icon", "dep:rfd"]

[profile.release]
# Fast code (the sound effects, the decoding and the drawing run hot), whole-program LTO, no
# unwinding tables, no symbols. "z" (smallest) was about 9 MB lighter but slower.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lib]
name = "rymplayer"
path = "src/lib.rs"

[[bin]]
name = "RyM"
path = "src/main.rs"

[[bin]]
name = "RymPlayer-GTK"
path = "src/bin/gtk/main.rs"
required-features = ["gtk-ui"]

[[bin]]
name = "RyM-Slint"
path = "src/bin/slint/main.rs"
required-features = ["slint-ui"]

[build-dependencies]
# Puts each program's icon inside its .exe (Windows).
embed-resource = "3"
# Compiles the Slint app's window (ui/app.slint).
slint-build = { version = "1.18.1", optional = true }

[dev-dependencies]
